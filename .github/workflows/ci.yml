name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agri
          POSTGRES_PASSWORD: agri
          POSTGRES_DB: agri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agri -d agri_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://agri:agri@localhost:5432/agri_test
      SECRET_KEY: ci-secret
      SEED_DEMO: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API deps
        run: pip install -r services/api/requirements.txt
      - name: API tests
        working-directory: services/api
        run: pytest -q
      - name: AlFilaha frontend smoke
        run: |
          test -f apps/alfilaha/index.html
          test -f apps/alfilaha/Dockerfile
          test -f apps/alfilaha/nginx.conf
          python -c "from pathlib import Path; t=Path('apps/alfilaha/index.html').read_text(encoding='utf-8'); assert 'الفلاحة برو' in t; assert 'manager@farm.ma' in t; assert 'page-builder' not in t; assert len(t)>300000"
      - name: Build containers
        run: docker compose build api web responder

  deploy-dev:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      - name: Record deploy artifact
        run: |
          mkdir -p artifacts
          echo "image_tag=${GITHUB_SHA}" >> artifacts/dev-deploy.env
          echo "Deployed commit ${GITHUB_SHA} to development (configure RENDER_DEPLOY_HOOK_DEV secret for live deploy)." >> $GITHUB_STEP_SUMMARY
      - name: Trigger Render/Fly/Railway hook when configured
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_DEV }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$DEPLOY_HOOK"
          else
            echo "No RENDER_DEPLOY_HOOK_DEV secret; CI verified build only."
          fi
