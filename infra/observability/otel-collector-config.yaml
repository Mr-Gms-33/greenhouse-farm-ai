receivers:
  otlp:
    protocols:
      grpc:
      http:

processors:
  batch:
  attributes/redact:
    actions:
      - key: customer.name
        action: delete
      - key: sale.amount
        action: delete
      - key: expense.amount
        action: delete
      - key: password
        action: delete
      - key: authorization
        action: delete

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    tls:
      insecure: true
  logging:
    loglevel: info

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, attributes/redact]
      exporters: [otlp/tempo, logging]
    metrics:
      receivers: [otlp]
      processors: [batch, attributes/redact]
      exporters: [prometheus, logging]
    logs:
      receivers: [otlp]
      processors: [batch, attributes/redact]
      exporters: [loki, logging]
