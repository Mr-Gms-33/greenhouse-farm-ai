route:
  receiver: responder
  group_by: [alertname]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: responder
    webhook_configs:
      - url: http://responder:8089/webhook
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials: unused
        max_alerts: 10
