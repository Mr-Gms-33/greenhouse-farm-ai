# Blueprint for https://render.com — connect the GitHub repo and deploy.
# Set SECRET_KEY and database automatically via Render managed Postgres.

databases:
  - name: agri-db
    plan: free

services:
  - type: web
    name: agri-api
    runtime: docker
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agri-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: SEED_DEMO
        value: "true"
      - key: OPS_TOKEN
        generateValue: true

  - type: web
    name: agri-web
    runtime: docker
    dockerfilePath: ./apps/alfilaha/Dockerfile
    dockerContext: ./apps/alfilaha
    plan: free
